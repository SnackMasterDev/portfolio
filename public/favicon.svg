<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#141a27"/>
      <stop offset="55%" stop-color="#0d1017"/>
      <stop offset="100%" stop-color="#06080c"/>
    </radialGradient>

    <!-- Seamless Cyan-to-Orange Neon Gradient for Stroke -->
    <linearGradient id="neonSplitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="48%" stop-color="#00e1ff"/>
      <stop offset="52%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>

    <!-- Cyan Neon Tube Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a6f7ff"/>
      <stop offset="40%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>

    <!-- Orange Neon Tube Gradient -->
    <linearGradient id="orangeNeon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd2a6"/>
      <stop offset="40%" stop-color="#ff7b00"/>
      <stop offset="100%" stop-color="#e64200"/>
    </linearGradient>

    <!-- Central S Fill Gradient -->
    <linearGradient id="sFillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c8f0"/>
      <stop offset="48%" stop-color="#00b0e0"/>
      <stop offset="52%" stop-color="#e65c00"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>

    <!-- Master Glow Filter combining Cyan and Orange without hard-edge clipping -->
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feGaussianBlur stdDeviation="38" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowOrange" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feGaussianBlur stdDeviation="38" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambientBacklight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>

    <!-- Clip paths with soft overlap to avoid hard seam -->
    <clipPath id="leftOverlap">
      <rect x="0" y="0" width="516" height="1024"/>
    </clipPath>
    <clipPath id="rightOverlap">
      <rect x="508" y="0" width="516" height="1024"/>
    </clipPath>

    <!-- Master Bitten Cookie Silhouette -->
    <path id="cookieSilhouette" d="
      M 808 356
      A 328 328 0 1 1 620 202
      C 610 226, 612 244, 638 258
      C 620 274, 622 296, 652 316
      C 638 334, 642 352, 674 368
      C 716 384, 764 380, 808 356
      Z
    "/>

    <!-- Unified S Path -->
    <path id="letterS" d="
      M 512 312
      L 582 312
      L 582 344
      L 614 344
      L 614 380
      L 652 380
      L 652 436
      L 596 436
      L 596 406
      L 564 406
      L 564 378
      C 542 378, 528 378, 512 378
      C 472 378, 444 404, 444 434
      C 444 446, 456 460, 508 480
      C 572 506, 654 536, 654 624
      C 654 682, 594 712, 512 712
      C 434 712, 370 660, 370 592
      L 446 592
      C 446 626, 474 646, 512 646
      C 552 646, 578 626, 578 600
      C 578 584, 564 570, 512 550
      C 448 526, 370 494, 370 416
      C 370 348, 432 312, 512 312
      Z
    "/>
  </defs>

  <!-- 1. Squircle Badge (Rounded Dark Square) -->
  <rect x="24" y="24" width="976" height="976" rx="200" ry="200" fill="url(#bgGlow)" stroke="#182030" stroke-width="4"/>
  <rect x="24" y="24" width="976" height="976" rx="200" ry="200" fill="none" stroke="#25324b" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- 2. Ambient Underglow Behind Cookie -->
  <g filter="url(#ambientBacklight)" opacity="0.38">
    <circle cx="370" cy="512" r="230" fill="#00d5ff"/>
    <circle cx="650" cy="512" r="230" fill="#ff6a00"/>
  </g>

  <!-- 3. Cookie Interior Disc -->
  <use href="#cookieSilhouette" fill="#090c13" stroke="#131722" stroke-width="4"/>

  <!-- Concentric Inner Thin Line -->
  <circle cx="512" cy="512" r="306" fill="none" stroke="#1c2436" stroke-width="2.5" opacity="0.55"/>

  <!-- 4. Circuit Board Traces -->
  <!-- Left Cyan Circuits -->
  <g stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" fill="none">
    <path d="M 460 205 L 460 270 L 436 294 L 382 294" />
    <circle cx="382" cy="294" r="5" fill="#00f0ff" />
    <path d="M 488 202 L 488 250" />
    <circle cx="488" cy="250" r="4.5" fill="#00f0ff" />

    <path d="M 235 430 L 255 450 L 255 500" />
    <circle cx="255" cy="500" r="4.5" fill="#00f0ff" />
    <path d="M 225 560 L 252 560 L 268 576 L 268 605" />
    <circle cx="268" cy="605" r="5" fill="#00f0ff" />

    <path d="M 374 734 L 394 714 L 444 714 L 460 730 L 488 730" />
    <circle cx="374" cy="734" r="5" fill="#00f0ff" />
    <path d="M 488 775 L 488 820" />
    <circle cx="488" cy="775" r="4.5" fill="#00f0ff" />
    <path d="M 440 765 L 460 765 L 476 781 L 476 812" />
  </g>

  <!-- Right Orange Circuits -->
  <g stroke="#ff7700" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" fill="none">
    <path d="M 536 202 L 536 260 L 560 284 L 590 284" />
    <circle cx="590" cy="284" r="5" fill="#ff7700" />
    <path d="M 564 205 L 564 246" />

    <path d="M 785 435 L 765 455 L 765 505" />
    <circle cx="765" cy="505" r="4.5" fill="#ff7700" />
    <path d="M 788 550 L 762 550 L 748 564 L 748 600" />
    <circle cx="748" cy="600" r="5" fill="#ff7700" />

    <path d="M 646 720 L 624 720 L 602 742 L 540 742" />
    <circle cx="646" cy="720" r="5" fill="#ff7700" />
    <path d="M 536 775 L 536 820" />
    <circle cx="536" cy="775" r="4.5" fill="#ff7700" />
  </g>

  <!-- 5. Cookie Outer Rim & Bite Outline with Soft Transition -->
  <!-- Ambient Glow layer for the entire rim -->
  <use href="#cookieSilhouette" fill="none" stroke="url(#neonSplitGrad)" stroke-width="30" opacity="0.3" filter="url(#glowCyan)"/>
  <use href="#cookieSilhouette" fill="none" stroke="url(#neonSplitGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#cookieSilhouette" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 6. Floating Pixel/Byte Crumbs -->
  <!-- Orange Crumbs -->
  <g filter="url(#glowOrange)">
    <rect x="752" y="202" width="40" height="40" rx="7" transform="rotate(45, 772, 222)" fill="url(#orangeNeon)" stroke="#ffe8d1" stroke-width="2.5"/>
    <rect x="764" y="295" width="22" height="22" rx="4" fill="url(#orangeNeon)" stroke="#ffd7b3" stroke-width="2"/>
    <rect x="672" y="284" width="18" height="18" rx="3.5" fill="url(#orangeNeon)"/>
  </g>

  <!-- Cyan Crumbs -->
  <g filter="url(#glowCyan)">
    <rect x="670" y="214" width="28" height="28" rx="5" fill="url(#cyanNeon)" stroke="#ccf8ff" stroke-width="2.5"/>
    <rect x="724" y="270" width="16" height="16" rx="3" fill="url(#cyanNeon)" stroke="#e6fcff" stroke-width="1.5"/>
    <rect x="718" y="320" width="16" height="16" rx="3" fill="url(#cyanNeon)"/>
  </g>

  <!-- 7. Left Curly Bracket { in Neon Cyan -->
  <g filter="url(#glowCyan)">
    <path d="M 360 328 
             C 318 328, 286 354, 284 394 
             L 284 460 
             C 284 488, 270 504, 250 512 
             C 270 520, 284 536, 284 564 
             L 284 630 
             C 286 670, 318 696, 360 696" 
          fill="none" 
          stroke="#00f0ff" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.3"/>

    <path d="M 360 328 
             C 318 328, 286 354, 284 394 
             L 284 460 
             C 284 488, 270 504, 250 512 
             C 270 520, 284 536, 284 564 
             L 284 630 
             C 286 670, 318 696, 360 696" 
          fill="none" 
          stroke="url(#cyanNeon)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <path d="M 360 328 
             C 318 328, 286 354, 284 394 
             L 284 460 
             C 284 488, 270 504, 250 512 
             C 270 520, 284 536, 284 564 
             L 284 630 
             C 286 670, 318 696, 360 696" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.9"/>
  </g>

  <!-- 8. Right Curly Bracket } in Neon Orange -->
  <g filter="url(#glowOrange)">
    <path d="M 664 328 
             C 706 328, 738 354, 740 394 
             L 740 460 
             C 740 488, 754 504, 774 512 
             C 754 520, 740 536, 740 564 
             L 740 630 
             C 738 670, 706 696, 664 696" 
          fill="none" 
          stroke="#ff7300" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.3"/>

    <path d="M 664 328 
             C 706 328, 738 354, 740 394 
             L 740 460 
             C 740 488, 754 504, 774 512 
             C 754 520, 740 536, 740 564 
             L 740 630 
             C 738 670, 706 696, 664 696" 
          fill="none" 
          stroke="url(#orangeNeon)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <path d="M 664 328 
             C 706 328, 738 354, 740 394 
             L 740 460 
             C 740 488, 754 504, 774 512 
             C 754 520, 740 536, 740 564 
             L 740 630 
             C 738 670, 706 696, 664 696" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.9"/>
  </g>

  <!-- 9. Central Letter 'S' (Unified Body) -->
  <!-- Fill with smooth cyan to orange blend -->
  <use href="#letterS" fill="url(#sFillGrad)" fill-opacity="0.9"/>

  <!-- Stroke around S with neon blend -->
  <use href="#letterS" fill="none" stroke="url(#neonSplitGrad)" stroke-width="26" opacity="0.35" filter="url(#glowCyan)"/>
  <use href="#letterS" fill="none" stroke="url(#neonSplitGrad)" stroke-width="12" stroke-linejoin="round"/>
  <use href="#letterS" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" stroke-linejoin="round"/>

  <!-- Attached Orange Pixel Nibbles on the S shoulder -->
  <g filter="url(#glowOrange)">
    <rect x="588" y="324" width="20" height="20" rx="3.5" fill="url(#orangeNeon)" stroke="#ffe4cc" stroke-width="2.5"/>
    <rect x="618" y="356" width="20" height="20" rx="3.5" fill="url(#orangeNeon)" stroke="#ffe4cc" stroke-width="2.5"/>
  </g>

</svg>