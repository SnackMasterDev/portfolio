<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🌸 Calibrador de Ramas y Capas del Sakura</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 20px;
      background: #f4eee5;
      font-family: system-ui, -apple-system, sans-serif;
      color: #1c1c1e;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header h1 {
      margin: 0;
      color: #831843;
      font-size: 26px;
    }
    header p {
      margin: 6px 0 0;
      color: #6b6966;
      font-size: 14px;
    }
    .top-bar {
      max-width: 1392px;
      margin: 0 auto 15px auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 12px 18px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      gap: 10px;
    }
    .top-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-primary {
      background: #db2777;
      color: white;
    }
    .btn-primary:hover {
      background: #be185d;
    }
    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #d1d5db;
    }
    .btn-secondary:hover {
      background: #e5e7eb;
    }
    .btn-danger {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fca5a5;
    }
    .btn-danger:hover {
      background: #fecaca;
    }
    select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      font-size: 13px;
      background: white;
    }
    .canvas-wrapper {
      position: relative;
      width: 1392px;
      max-width: 100%;
      margin: 0 auto 20px auto;
      background: #f4eee5;
      border: 2px solid #db2777;
      border-radius: 8px;
      overflow: auto; /* Permite scroll horizontal en monitores pequeños sin recortar ningún pixel */
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }
    .container {
      position: relative;
      width: 1392px;
      height: 752px;
      min-width: 1392px;
      min-height: 752px;
      user-select: none;
      background: #f4eee5;
    }
    .hud-badge {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 100;
      background: rgba(28, 28, 30, 0.85);
      color: #fdf2f8;
      backdrop-filter: blur(4px);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      pointer-events: none;
      border: 1px solid rgba(219, 39, 119, 0.4);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .layer {
      position: absolute;
      cursor: grab;
      user-select: none;
      transform-origin: center center;
      transition: outline 0.1s;
    }
    .layer:active {
      cursor: grabbing;
    }
    .layer.locked {
      cursor: not-allowed !important;
    }
    .layer.selected {
      outline: 2px dashed #db2777;
      outline-offset: 2px;
    }
    input[type="range"]:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .layer-card.is-locked {
      background: #fafaf9;
      border-color: #fde68a;
    }
    .controls {
      max-width: 1392px;
      margin: 20px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 15px;
    }
    .layer-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .layer-card.selected {
      border-color: #db2777;
      box-shadow: 0 0 0 2px rgba(219,39,119,0.2);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f3f4f6;
      padding-bottom: 8px;
      margin-bottom: 4px;
    }
    .card-header h3 {
      margin: 0;
      font-size: 14px;
      color: #831843;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-actions {
      display: flex;
      gap: 5px;
    }
    .prop-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .prop-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: #4b5563;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      accent-color: #db2777;
      cursor: pointer;
    }
    .output-section {
      max-width: 1392px;
      margin: 20px auto;
      background: #ffffff;
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    pre {
      background: #18181b;
      color: #38bdf8;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      font-family: monospace;
      font-size: 12px;
      margin: 10px 0 0 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌸 Calibrador de Ramas y Capas del Árbol Sakura</h1>
    <p>Arrastra las ramas directamente sobre el lienzo o usa los controles para mover, escalar, rotar, duplicar y aplicar modo espejo.</p>
  </header>

  <div class="top-bar">
    <div class="top-group">
      <label style="font-weight: 600; font-size: 13px;">Nueva rama:</label>
      <select id="select-branch-type">
        <option value="rama_4">Rama 4 (Copa Grande Principal)</option>
        <option value="rama_1">Rama 1 (Rama Media Frondosa)</option>
        <option value="rama_3">Rama 3 (Rama Larga Colgante)</option>
        <option value="rama_2">Rama 2 (Punta con Flores)</option>
        <option value="tronco">Tronco</option>
      </select>
      <button id="btn-add-branch" class="btn btn-primary">➕ Agregar Rama</button>
    </div>

    <div class="top-group">
      <button id="btn-reset" class="btn btn-secondary" title="Reiniciar a solo fondo y tronco">🔄 Limpiar (Solo Tronco)</button>
      <button id="btn-copy-json" class="btn btn-primary">📋 Copiar Configuración JSON</button>
    </div>
  </div>

  <div class="canvas-wrapper">
    <div class="container" id="stage">
      <div id="hud-badge" class="hud-badge">🌸 Haz clic o arrastra cualquier rama para posicionarla</div>
      <!-- Capa 0: Fondo cielo y colinas en tamaño real 1:1 sin recorte (1392 x 752) -->
      <img id="bg" src="/assets/tree/imagen-fondo.webp" style="position: absolute; left: 0; top: 0; width: 1392px; height: 752px; pointer-events: none; display: block;" />
      <!-- Contenedor dinámico de capas de ramas y tronco -->
      <div id="layers-container"></div>
    </div>
  </div>

  <div class="controls" id="controls"></div>

  <div class="output-section">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 style="margin: 0; color: #831843;">Configuración JSON Actual (Persistida en tu navegador)</h3>
      <button id="btn-copy-bottom" class="btn btn-secondary">📋 Copiar JSON</button>
    </div>
    <pre id="json-output"></pre>
  </div>

  <script>
    // Configuración base limpia: Solo el tronco con el samurai sobre el fondo washi
    const INITIAL_CONFIG = [
      { id: 'tronco', src: 'tronco', name: 'Tronco y Samurai', left: 44, top: -8, width: 60, scale: 1, rot: 0, flipX: false, z: 10, opacity: 1, locked: true }
    ];

    let layers = JSON.parse(localStorage.getItem('sakura_branches_calibrator_v5') || 'null');
    if (!layers || layers.length === 0) {
      layers = JSON.parse(JSON.stringify(INITIAL_CONFIG));
    }
    let selectedId = null;

    const stage = document.getElementById('stage');
    const layersContainer = document.getElementById('layers-container');
    const controlsContainer = document.getElementById('controls');
    const jsonOutput = document.getElementById('json-output');

    function saveState() {
      localStorage.setItem('sakura_branches_calibrator_v5', JSON.stringify(layers));
      jsonOutput.textContent = JSON.stringify(layers, null, 2);
    }

    const hudBadge = document.getElementById('hud-badge');

    function updateHUD(item) {
      if (!hudBadge) return;
      if (!item) {
        hudBadge.innerHTML = '🌸 Agrega una rama arriba o haz clic en una para moverla';
        return;
      }
      const lockHtml = item.locked ? ' | <span style="color:#fbbf24; font-weight:bold;">🔒 Bloqueado</span>' : '';
      hudBadge.innerHTML = `🌸 <b>${item.name || item.id}</b> | X: <span style="color:#f472b6;">${item.left}%</span> | Y: <span style="color:#f472b6;">${item.top}%</span> | Escala: ${item.scale} | Rot: ${item.rot}° ${item.flipX ? '| 🪞 Espejo' : ''}${lockHtml}`;
    }

    function renderStage() {
      layersContainer.innerHTML = '';
      layers.forEach(item => {
        const img = document.createElement('img');
        img.id = 'layer-' + item.id;
        img.className = 'layer' + (selectedId === item.id ? ' selected' : '') + (item.locked ? ' locked' : '');
        img.src = '/assets/tree/' + item.src + '.webp';
        img.style.left = item.left + '%';
        img.style.top = item.top + '%';
        img.style.width = item.width + '%';
        img.style.zIndex = item.z;
        img.style.opacity = item.opacity ?? 1;
        img.style.cursor = item.locked ? 'default' : 'grab';
        
        const flipScale = item.flipX ? -item.scale : item.scale;
        img.style.transform = `scale(${flipScale}, ${item.scale}) rotate(${item.rot}deg)`;

        // Arrastre fluido moderno con pointer events y pointer capture
        img.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          e.stopPropagation();
          selectLayer(item.id, false);
          updateHUD(item);

          if (item.locked) {
            return; // Si está bloqueado, no se mueve
          }

          try {
            img.setPointerCapture(e.pointerId);
          } catch (_) {}

          const startX = e.clientX;
          const startY = e.clientY;
          const startLeft = item.left;
          const startTop = item.top;
          const stageRect = stage.getBoundingClientRect();

          function onPointerMove(moveEvent) {
            const dx = moveEvent.clientX - startX;
            const dy = moveEvent.clientY - startY;
            const dLeftPercent = (dx / stageRect.width) * 100;
            const dTopPercent = (dy / stageRect.height) * 100;

            item.left = Math.round((startLeft + dLeftPercent) * 2) / 2;
            item.top = Math.round((startTop + dTopPercent) * 2) / 2;

            img.style.left = item.left + '%';
            img.style.top = item.top + '%';

            updateHUD(item);
            updateCardInputs(item);
            saveState();
          }

          function onPointerUp(upEvent) {
            try {
              img.releasePointerCapture(upEvent.pointerId);
            } catch (_) {}
            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);
          }

          window.addEventListener('pointermove', onPointerMove);
          window.addEventListener('pointerup', onPointerUp);
        });

        layersContainer.appendChild(img);
      });
    }

    function selectLayer(id, shouldScroll = false) {
      selectedId = id;
      document.querySelectorAll('.layer').forEach(el => {
        el.classList.toggle('selected', el.id === 'layer-' + id);
      });
      document.querySelectorAll('.layer-card').forEach(el => {
        el.classList.toggle('selected', el.dataset.id === id);
      });
      const current = layers.find(x => x.id === id);
      updateHUD(current);

      if (shouldScroll) {
        const card = document.querySelector(`.layer-card[data-id="${id}"]`);
        if (card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }
    }

    function updateCardInputs(item) {
      const card = document.querySelector(`.layer-card[data-id="${item.id}"]`);
      if (!card) return;
      ['left', 'top', 'width', 'scale', 'rot', 'z', 'opacity'].forEach(prop => {
        const input = card.querySelector(`[data-prop="${prop}"]`);
        const valSpan = card.querySelector(`.${prop}-val`);
        if (input && valSpan) {
          input.value = item[prop];
          valSpan.textContent = item[prop] + (prop === 'rot' ? '°' : prop === 'scale' || prop === 'z' || prop === 'opacity' ? '' : '%');
        }
      });
    }

    function renderControls() {
      controlsContainer.innerHTML = '';
      layers.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'layer-card' + (selectedId === item.id ? ' selected' : '') + (item.locked ? ' is-locked' : '');
        card.dataset.id = item.id;

        card.innerHTML = `
          <div class="card-header">
            <h3>🌸 ${item.name || item.id}</h3>
            <div class="card-actions">
              <button class="btn btn-secondary btn-lock" title="Bloquear / Desbloquear posición" style="${item.locked ? 'background: #fef3c7; border-color: #f59e0b; color: #b45309; font-weight: bold;' : ''}">
                ${item.locked ? '🔒 Bloqueado' : '🔓 Desbloqueado'}
              </button>
              <button class="btn btn-secondary btn-mirror" title="Alternar Espejo (Flip X)" style="${item.flipX ? 'background: #fbcfe8; border-color: #db2777; color: #831843;' : ''}">
                🪞 ${item.flipX ? 'Reflejado' : 'Espejo'}
              </button>
              <button class="btn btn-secondary btn-duplicate" title="Duplicar esta rama">➕</button>
              <button class="btn btn-danger btn-delete" title="Eliminar rama">🗑️</button>
            </div>
          </div>

          <div class="prop-row">
            <div class="prop-label"><span>Horizontal (Left):</span><span class="left-val">${item.left}%</span></div>
            <input type="range" ${item.locked ? 'disabled' : ''} min="-30" max="110" step="0.5" value="${item.left}" data-prop="left">
          </div>

          <div class="prop-row">
            <div class="prop-label"><span>Vertical (Top):</span><span class="top-val">${item.top}%</span></div>
            <input type="range" ${item.locked ? 'disabled' : ''} min="-40" max="110" step="0.5" value="${item.top}" data-prop="top">
          </div>

          <div class="prop-row">
            <div class="prop-label"><span>Ancho (Width):</span><span class="width-val">${item.width}%</span></div>
            <input type="range" ${item.locked ? 'disabled' : ''} min="5" max="100" step="0.5" value="${item.width}" data-prop="width">
          </div>

          <div class="prop-row">
            <div class="prop-label"><span>Escala (Scale):</span><span class="scale-val">${item.scale}</span></div>
            <input type="range" ${item.locked ? 'disabled' : ''} min="0.3" max="2.2" step="0.02" value="${item.scale}" data-prop="scale">
          </div>

          <div class="prop-row">
            <div class="prop-label"><span>Rotación:</span><span class="rot-val">${item.rot}°</span></div>
            <input type="range" ${item.locked ? 'disabled' : ''} min="-180" max="180" step="1" value="${item.rot}" data-prop="rot">
          </div>

          <div class="prop-row">
            <div class="prop-label"><span>Profundidad (Z-Index):</span><span class="z-val">${item.z}</span></div>
            <input type="range" ${item.locked ? 'disabled' : ''} min="1" max="25" step="1" value="${item.z}" data-prop="z">
          </div>

          <div class="prop-row">
            <div class="prop-label"><span>Opacidad:</span><span class="opacity-val">${item.opacity ?? 1}</span></div>
            <input type="range" ${item.locked ? 'disabled' : ''} min="0.2" max="1" step="0.05" value="${item.opacity ?? 1}" data-prop="opacity">
          </div>
        `;

        // Eventos
        card.addEventListener('click', () => selectLayer(item.id, false));

        card.querySelector('.btn-lock').addEventListener('click', (e) => {
          e.stopPropagation();
          item.locked = !item.locked;
          renderStage();
          renderControls();
          saveState();
          updateHUD(item);
        });

        card.querySelector('.btn-mirror').addEventListener('click', (e) => {
          e.stopPropagation();
          item.flipX = !item.flipX;
          renderStage();
          renderControls();
          saveState();
        });

        card.querySelector('.btn-duplicate').addEventListener('click', (e) => {
          e.stopPropagation();
          duplicateLayer(item);
        });

        card.querySelector('.btn-delete').addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirm(`¿Eliminar ${item.name || item.id}?`)) {
            deleteLayer(item.id);
          }
        });

        card.addEventListener('input', (e) => {
          const prop = e.target.dataset.prop;
          if (!prop) return;
          item[prop] = parseFloat(e.target.value);
          card.querySelector(`.${prop}-val`).textContent = item[prop] + (prop === 'rot' ? '°' : prop === 'scale' || prop === 'z' || prop === 'opacity' ? '' : '%');
          
          const img = document.getElementById('layer-' + item.id);
          if (img) {
            img.style.left = item.left + '%';
            img.style.top = item.top + '%';
            img.style.width = item.width + '%';
            img.style.zIndex = item.z;
            img.style.opacity = item.opacity;
            const flipScale = item.flipX ? -item.scale : item.scale;
            img.style.transform = `scale(${flipScale}, ${item.scale}) rotate(${item.rot}deg)`;
          }
          saveState();
        });

        controlsContainer.appendChild(card);
      });
    }

    function duplicateLayer(item) {
      const newId = item.src + '_' + Date.now().toString().slice(-4);
      const cloned = {
        ...JSON.parse(JSON.stringify(item)),
        id: newId,
        name: (item.name || item.id) + ' (Copia)',
        left: item.left + 3,
        top: item.top + 2,
        z: item.z + 1,
        locked: false
      };
      layers.push(cloned);
      selectedId = newId;
      renderStage();
      renderControls();
      saveState();
    }

    function deleteLayer(id) {
      layers = layers.filter(x => x.id !== id);
      if (selectedId === id) selectedId = null;
      renderStage();
      renderControls();
      saveState();
    }

    document.getElementById('btn-add-branch').addEventListener('click', () => {
      const type = document.getElementById('select-branch-type').value;
      const count = layers.filter(x => x.src === type).length + 1;
      const names = {
        rama_4: 'Rama 4 Copa',
        rama_1: 'Rama 1 Media',
        rama_3: 'Rama 3 Larga',
        rama_2: 'Rama 2 Punta',
        tronco: 'Tronco'
      };
      const widths = {
        rama_4: 52,
        rama_1: 36,
        rama_3: 32,
        rama_2: 18,
        tronco: 60
      };
      const newLayer = {
        id: type + '_' + Date.now().toString().slice(-4),
        src: type,
        name: `${names[type] || type} #${count}`,
        left: 45,
        top: 10,
        width: widths[type] || 35,
        scale: 1,
        rot: 0,
        flipX: false,
        z: 15,
        opacity: 1,
        locked: false
      };
      layers.push(newLayer);
      selectedId = newLayer.id;
      renderStage();
      renderControls();
      saveState();
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      if (confirm('¿Limpiar el lienzo y dejar solo el tronco con el samurai sobre el fondo?')) {
        layers = JSON.parse(JSON.stringify(INITIAL_CONFIG));
        selectedId = 'tronco';
        renderStage();
        renderControls();
        saveState();
        updateHUD(layers[0]);
      }
    });

    function copyJSON() {
      navigator.clipboard.writeText(JSON.stringify(layers, null, 2));
      alert('¡Configuración copiada al portapapeles! Pégamela en el chat o guárdala.');
    }

    document.getElementById('btn-copy-json').addEventListener('click', copyJSON);
    document.getElementById('btn-copy-bottom').addEventListener('click', copyJSON);

    // Inicializar
    renderStage();
    renderControls();
    saveState();
  </script>
</body>
</html>
